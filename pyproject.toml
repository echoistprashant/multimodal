[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mdis"
version = "0.1.0"
description = "Multimodal Document Intelligence System (MDIS) - Enterprise OCR, Vision, Structured Extraction & Multimodal RAG"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Prashant Yadav", email = "yadavprashant100804@gmail.com" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "pgvector>=0.2.5",
    "redis>=5.0.3",
    "httpx>=0.27.0",
    "pillow>=10.2.0",
    "pypdfium2>=4.28.0",
    "pdfplumber>=0.10.4",
    "opencv-python-headless>=4.9.0",
    "pytesseract>=0.3.10",
    "rapidfuzz>=3.6.1",
    "structlog>=24.1.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.2",
    "mypy>=1.9.0",
    "respx>=0.21.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "B", "C4"]
ignore = ["E501"]

[tool.ruff.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = ["tests"]
pythonpath = ["."]

